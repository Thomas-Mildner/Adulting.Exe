name: Staging Pipeline

on:
  push:
    branches:
      - staging
  schedule:
    - cron: '0 2 * * *' # Run at 2:00 AM daily
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/adulting-exe

jobs:
  nightly-merge:
    name: Merge dev → staging
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}

    permissions:
      contents: write

    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch branches
        run: git fetch origin dev

      - name: Check for changes
        id: check
        run: |
          DIFF=$(git diff HEAD..origin/dev --stat)
          if [ -z "$DIFF" ]; then
            echo "No changes to merge"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Merge dev into staging
        if: steps.check.outputs.has_changes == 'true'
        run: git merge origin/dev --no-edit

      - name: Push changes
        if: steps.check.outputs.has_changes == 'true'
        run: git push origin staging

  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    needs: nightly-merge
    if: |
      always() &&
      (github.event_name != 'schedule' || needs.nightly-merge.outputs.has_changes == 'true')

    permissions:
      contents: read

    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Build application
        run: pnpm build

  release-version:
    name: Determine RC Version
    runs-on: ubuntu-latest
    needs: build
    outputs:
      version: ${{ steps.version.outputs.version }}

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Semantic Release (dry run)
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(npx semantic-release --dry-run --branches staging 2>&1 | grep -oP 'The next release version is \K[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -n "$VERSION" ]; then
            echo "version=${VERSION}-rc" >> $GITHUB_OUTPUT
          else
            PKG_VERSION=$(node -p "require('./package.json').version")
            echo "version=${PKG_VERSION}-rc" >> $GITHUB_OUTPUT
          fi

      - name: Output version
        id: version
        run: |
          echo "version=${{ steps.semantic.outputs.version }}" >> $GITHUB_OUTPUT

  docker:
    name: Push Beta Image
    runs-on: ubuntu-latest
    needs: [build, release-version]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:beta-latest
            ${{ env.IMAGE_NAME }}:${{ needs.release-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ needs.release-version.outputs.version }}
