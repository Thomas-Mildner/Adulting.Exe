version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: adulting-exe-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: adulting
      POSTGRES_PASSWORD: adulting_secret
      POSTGRES_DB: adulting_exe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adulting -d adulting_exe"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: adulting-exe-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://adulting:adulting_secret@postgres:5432/adulting_exe
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: adulting-exe-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@test.de
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "5050:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgpass:ro
    entrypoint: >
      /bin/sh -c "
      cp /pgpass /var/lib/pgadmin/pgpass;
      chmod 600 /var/lib/pgadmin/pgpass;
      chown pgadmin:pgadmin /var/lib/pgadmin/pgpass;
      /entrypoint.sh
      "
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
