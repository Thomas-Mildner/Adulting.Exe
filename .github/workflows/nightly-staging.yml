name: Staging Pipeline

on:
  push:
    branches:
      - staging
  schedule:
    - cron: '0 2 * * *' # Run at 2:00 AM daily
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/adulting-exe

jobs:
  nightly-merge:
    name: Merge dev → staging
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.repository == 'Thomas-Mildner/Adulting.Exe'
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}

    permissions:
      contents: write

    steps:
      - name: Checkout staging
        uses: actions/checkout@v6
        with:
          ref: staging
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch branches
        run: git fetch origin dev

      - name: Check for changes
        id: check
        run: |
          DIFF=$(git diff HEAD..origin/dev --stat)
          if [ -z "$DIFF" ]; then
            echo "No changes to merge"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Merge dev into staging
        if: steps.check.outputs.has_changes == 'true'
        run: git merge origin/dev --no-edit

      - name: Push changes
        if: steps.check.outputs.has_changes == 'true'
        run: git push origin staging

  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    needs: nightly-merge
    if: |
      always() &&
      !cancelled() &&
      !failure() &&
      (github.event_name != 'schedule' || needs.nightly-merge.outputs.has_changes == 'true')

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: staging

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Build application
        run: pnpm build

  release:
    name: Semantic Release (RC)
    runs-on: ubuntu-latest
    needs: build
    if: |
      always() &&
      !cancelled() &&
      needs.build.result == 'success' &&
      (github.repository == 'Thomas-Mildner/Adulting.Exe' || github.repository == 'Thomas-Mildner/Adulting.Exe-Privat')
    outputs:
      released: ${{ steps.check.outputs.released }}
      version: ${{ steps.check.outputs.version }}

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: staging
          fetch-depth: 0
          persist-credentials: true

      - name: Ensure branch is checked out
        run: git checkout staging || git checkout -b staging

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Get version before release
        id: before
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Semantic Release
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF: refs/heads/staging
          GITHUB_REF_NAME: staging
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: npx semantic-release

      - name: Check release result
        id: check
        run: |
          AFTER=$(node -p "require('./package.json').version")
          BEFORE="${{ steps.before.outputs.version }}"
          echo "Version before: $BEFORE, version after: $AFTER"
          if [ "$AFTER" != "$BEFORE" ]; then
            echo "New release detected: $AFTER"
            echo "released=true" >> $GITHUB_OUTPUT
            echo "version=$AFTER" >> $GITHUB_OUTPUT
          else
            echo "No new release (version unchanged: $BEFORE)"
            echo "released=false" >> $GITHUB_OUTPUT
            echo "version=$BEFORE" >> $GITHUB_OUTPUT
          fi

  docker:
    name: Push Beta Image
    runs-on: ubuntu-latest
    needs: [build, release]
    if: |
      always() &&
      !cancelled() &&
      needs.build.result == 'success' &&
      needs.release.result == 'success' &&
      needs.release.outputs.released == 'true' &&
      (github.repository == 'Thomas-Mildner/Adulting.Exe' || github.repository == 'Thomas-Mildner/Adulting.Exe-Privat')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: v${{ needs.release.outputs.version }}

      - name: Log version info
        run: |
          echo "Building Docker image for version: ${{ needs.release.outputs.version }}"
          echo "Tags: beta-latest, ${{ needs.release.outputs.version }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:beta-latest
            ${{ env.IMAGE_NAME }}:${{ needs.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ needs.release.outputs.version }}
            
